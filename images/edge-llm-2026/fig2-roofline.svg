<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#1b2333">图 2　Roofline：为什么"加算力"救不了解码</text>
  <text x="32" y="68" font-size="14" fill="#7a8499">纵轴为可达算力，横轴为算术强度（每读 1 字节能做多少次运算）</text>

  <!-- axes -->
  <path d="M110 380 H890" stroke="#8a94a8" stroke-width="2"/>
  <path d="M110 380 V96" stroke="#8a94a8" stroke-width="2"/>
  <text x="724" y="414" font-size="14" fill="#5b6478">算术强度 I = FLOPs / Bytes →</text>
  <text x="42" y="108" font-size="14" fill="#5b6478">可达性能</text>
  <text x="42" y="130" font-size="14" fill="#5b6478">(TOPS)</text>

  <!-- roofline -->
  <path d="M110 380 L470 150 H890" fill="none" stroke="#5568f6" stroke-width="4"/>
  <path d="M470 150 H890" fill="none" stroke="#5568f6" stroke-width="4" stroke-dasharray="10 6" opacity="0.55"/>
  <text x="590" y="138" font-size="14" fill="#5568f6">算力天花板 π（计算受限区）</text>
  <text x="150" y="228" font-size="14" fill="#0ea5a4" transform="rotate(-32 150 228)">斜率 = 内存带宽 β</text>
  <text x="152" y="352" font-size="13" fill="#7a8499">内存带宽受限区</text>

  <!-- decode point -->
  <circle cx="215" cy="326" r="9" fill="#e2566d"/>
  <text x="232" y="316" font-size="15" font-weight="700" fill="#e2566d">Decode（batch=1）</text>
  <text x="232" y="338" font-size="13" fill="#7a8499">I ≈ 1，权重读完只算 1 个 token</text>
  <path d="M215 326 V380" stroke="#e2566d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- speculative point -->
  <circle cx="340" cy="238" r="8" fill="#f59e0b"/>
  <text x="356" y="230" font-size="14" font-weight="600" fill="#d98606">投机解码 / MTP</text>
  <text x="356" y="250" font-size="13" fill="#7a8499">一次验证 γ 个 token，I 提升 γ 倍</text>

  <!-- prefill / diffusion point -->
  <circle cx="640" cy="150" r="9" fill="#16a34a"/>
  <text x="660" y="142" font-size="15" font-weight="700" fill="#15803d">Prefill / 块扩散生成</text>
  <text x="660" y="164" font-size="13" fill="#7a8499">大块并行，落在平台段</text>

  <!-- arrows -->
  <path d="M222 306 Q280 260 330 244" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M348 218 Q470 150 620 150" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- conclusion -->
  <rect x="110" y="424" width="780" height="36" rx="8" fill="#f7f9ff" stroke="#dfe3ec" stroke-width="2"/>
  <text x="128" y="448" font-size="14" fill="#1b2333">三类优化的本质：提高算术强度（右移）、抬高带宽上限（上移斜率）、或干脆换到平台的另一侧</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f59e0b"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
